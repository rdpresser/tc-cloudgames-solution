# =============================================================================
# Resource Governance for cloudgames namespace
# =============================================================================
# Prevents resource overprovisioning and ensures reasonable defaults
# Applied as part of Quick Win #3 to prevent future scheduling issues
# =============================================================================

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudgames-quota
  namespace: cloudgames
spec:
  hard:
    # CPU limits
    requests.cpu: "6"           # 6 cores total (supports ~40 pods @ 150m each)
    limits.cpu: "16"            # 16 cores limit total
    
    # Memory limits
    requests.memory: 12Gi       # 12GB total (supports current HPA maxima with higher requests)
    limits.memory: 24Gi         # 24GB limit total
    
    # Pod count
    pods: "20"                  # Increased headroom for HPA scale-out
    
    # Other resources
    persistentvolumeclaims: "5"
    services: "10"
    configmaps: "20"
    secrets: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: cloudgames-limits
  namespace: cloudgames
spec:
  limits:
  # Container-level limits
  - type: Container
    max:
      memory: 2Gi               # Max memory per container
      cpu: 2000m                # Max CPU per container
    min:
      memory: 256Mi             # Min memory per container
      cpu: 50m                  # Min CPU per container
    default:                    # Applied if no limits specified
      memory: 1Gi
      cpu: 500m
    defaultRequest:             # Applied if no requests specified
      memory: 384Mi
      cpu: 100m
    maxLimitRequestRatio:       # Max ratio between limit and request
      memory: 3                 # limit can be max 3x request
      cpu: 10                   # limit can be max 10x request (to accommodate 150m->1000m = 6.6x)
  
  # Pod-level limits (sum of all containers)
  - type: Pod
    max:
      memory: 3Gi               # Max total memory per pod
      cpu: 3000m                # Max total CPU per pod
