# =============================================================================
# Scheduling Patches - Enforce even pod distribution across nodes
# =============================================================================
# Applies to: user-api, games-api, payments-api
# - topologySpreadConstraints with hostname key ensure replicas spread across nodes
# - podAntiAffinity discourages co-locating replicas of the same service
# - Uses DoNotSchedule to strictly avoid skew when capacity allows
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: user-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: user-api
                topologyKey: kubernetes.io/hostname
